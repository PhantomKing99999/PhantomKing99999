name: Generate profile stats

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - v1
    paths:
      - README.md
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile
        uses: actions/checkout@v6

      - name: Generate repository-hosted stats
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          custom-title: Andy's GitHub signal
          colors: dark
          animated-language-chart: true
          max-languages: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
